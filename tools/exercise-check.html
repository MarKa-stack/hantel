<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Übungsdatenbank prüfen</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { padding: 16px; font-family: system-ui, sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .cell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
    .cell h4 { margin: 6px 0 2px; font-size: 13px; }
    .cell p { margin: 0; font-size: 11px; color: var(--text-3); }
    .cell svg { width: 100%; height: 120px; display: block; background: var(--surface-2); border-radius: 8px; }
    .bad { border-color: #ff5c5c; }
    #problems { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: 10px; }
    h2 { margin: 22px 0 8px; }
  </style>
</head>
<body data-theme="dark">
  <h1>Übungsdatenbank</h1>
  <div id="summary"></div>
  <h2>Prüfung</h2>
  <div id="problems">läuft …</div>
  <div id="out"></div>

  <script type="module">
    import { EXERCISES, exercisesByCategory, exerciseFigure, searchExercises, variantsOf } from '../js/exercise-db.js';
    import { EQUIPMENT } from '../js/equipment.js';
    import { MUSCLE_NAME } from '../js/muscles.js';

    const problems = [];
    const seenId = new Set(), seenAlias = new Map();
    for (const e of EXERCISES) {
      if (seenId.has(e.id)) problems.push(`doppelte id: ${e.id}`);
      seenId.add(e.id);
      if (!e.primary?.length) problems.push(`${e.id}: primary fehlt`);
      for (const k of [...(e.primary || []), ...(e.secondary || [])]) if (!MUSCLE_NAME[k]) problems.push(`${e.id}: unbekannter Muskel ${k}`);
      if (!e.equip?.type) problems.push(`${e.id}: equip.type fehlt`);
      else if (!EQUIPMENT[e.equip.type]) problems.push(`${e.id}: unbekanntes Gerät ${e.equip.type}`);
      if (!e.fig) problems.push(`${e.id}: keine Figur`);
      if (!e.tips?.length) problems.push(`${e.id}: keine Tipps`);
      for (const a of e.aliases) {
        if (seenAlias.has(a) && seenAlias.get(a) !== e.id) problems.push(`Alias "${a}" doppelt: ${seenAlias.get(a)} / ${e.id}`);
        seenAlias.set(a, e.id);
      }
      try { if (!exerciseFigure(e, { still: true })) problems.push(`${e.id}: Figur rendert nicht`); }
      catch (err) { problems.push(`${e.id}: Figur-Fehler ${err.message}`); }
    }
    // Stichproben für die Suche
    for (const [q, id] of [['brustpresse', 'brustpresse'], ['bankdrücken', 'bankdruecken'], ['kniebeuge', 'kniebeuge'], ['latzug', 'latzug'], ['seitheben', 'seitheben-kh'], ['beinpresse', 'beinpresse'], ['klimmzug', 'klimmzuege'], ['bench press', 'bankdruecken'], ['squat', 'kniebeuge']]) {
      const hit = searchExercises(q)[0];
      if (!hit || hit.id !== id) problems.push(`Suche "${q}" → ${hit ? hit.id : 'nichts'} (erwartet ${id})`);
    }
    document.getElementById('summary').textContent = `${EXERCISES.length} Übungen · ${new Set(EXERCISES.map(e => e.baseId || e.id)).size} Bewegungen · ${new Set(EXERCISES.map(e => e.equip.type)).size} Gerätetypen`;
    document.getElementById('problems').textContent = problems.length ? problems.join('\n') : 'Alles in Ordnung.';

    const out = document.getElementById('out');
    for (const [label, list] of exercisesByCategory()) {
      const h = document.createElement('h2');
      h.textContent = `${label} (${list.length})`;
      out.append(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const e of list) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (e.fig ? '' : ' bad');
        cell.innerHTML = `${exerciseFigure(e, { still: false })}<h4>${e.name}</h4><p>${e.muscles}<br>${EQUIPMENT[e.equip.type]?.name || e.equip.type}${e.baseId ? ' · Variante von ' + e.baseId : ` · ${variantsOf(e).length} Varianten`}</p>`;
        grid.append(cell);
      }
      out.append(grid);
    }
  </script>
</body>
</html>
